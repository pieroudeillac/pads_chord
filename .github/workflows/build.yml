name: Compiler le plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Compiler
        run: cmake --build build --config Release --parallel

      - name: Tester le moteur de théorie
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Signer en local (macOS, nécessaire sur les Mac Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          for f in build/PadsAccords_artefacts/Release/VST3/*.vst3 build/PadsAccords_artefacts/Release/AU/*.component; do
            codesign --force --deep -s - "$f"
          done

      - name: Publier le plugin
        uses: actions/upload-artifact@v4
        with:
          name: PadsAccords-${{ runner.os }}
          path: |
            build/PadsAccords_artefacts/Release/VST3
            build/PadsAccords_artefacts/Release/AU

  # Quand les deux plateformes sont passées, publie/met à jour la release « latest ».
  # Les URL des fichiers restent stables : /releases/download/latest/PadsAccords-*.zip
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publier la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # pas de dépôt git dans dist/ : on l'indique explicitement
        run: |
          cd dist
          zip -qr "PadsAccords-Windows.zip" "PadsAccords-Windows"
          zip -qr "PadsAccords-macOS.zip" "PadsAccords-macOS"
          gh release create latest --prerelease --target main \
            --title "Dernière compilation (latest)" \
            --notes "Compilation automatique de « main ». Dézippez et copiez le dossier « Pads Accords.vst3 » dans le dossier VST3 (voir README)." \
            2>/dev/null || true
          gh release upload latest "PadsAccords-Windows.zip" "PadsAccords-macOS.zip" --clobber

  # Sur un tag v* (par ex. v1.0.0) : une version numérotée, qui n'est pas écrasée ensuite.
  release-tag:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publier la version numérotée
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # pas de dépôt git dans dist/ : on l'indique explicitement
        run: |
          cd dist
          zip -qr "PadsAccords-Windows.zip" "PadsAccords-Windows"
          zip -qr "PadsAccords-macOS.zip" "PadsAccords-macOS"
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "$VERSION" --target main \
            --title "Pads Accords $VERSION" \
            --notes "Dézippez et copiez le dossier « Pads Accords.vst3 » dans le dossier VST3 (voir README pour la procédure)."
          gh release upload "$VERSION" "PadsAccords-Windows.zip" "PadsAccords-macOS.zip"
